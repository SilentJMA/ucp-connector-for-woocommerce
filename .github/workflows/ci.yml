name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Lint PHP files
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name "*.php" -not -path "./.git/*" -print0)

      - name: Validate fixture JSON
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            jq -e . "$file" >/dev/null
          done < <(find fixtures -type f -name "*.json" -print0)

      - name: Check shell script syntax
        run: bash -n scripts/smoke-test.sh
