name: Metadata Consistency

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate version and license metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          def read(path):
            return pathlib.Path(path).read_text(encoding="utf-8")

          main_php = read("ucp_adapter_main.php")
          readme = read("readme.txt")

          def extract(pattern, text, label):
            m = re.search(pattern, text, re.MULTILINE)
            if not m:
              raise SystemExit(f"Missing expected field: {label}")
            return m.group(1).strip()

          header_version = extract(r"^\s*\*\s*Version:\s*(.+)$", main_php, "header version")
          const_version = extract(r"^define\('UCP_ADAPTER_VERSION',\s*'([^']+)'\);$", main_php, "const version")
          stable_tag = extract(r"^Stable tag:\s*(.+)$", readme, "stable tag")
          header_license = extract(r"^\s*\*\s*License:\s*(.+)$", main_php, "header license")
          readme_license = extract(r"^License:\s*(.+)$", readme, "readme license")

          checks = [
            ("header version vs const", header_version == const_version),
            ("header version vs stable tag", header_version == stable_tag),
            ("header license vs readme license", header_license == readme_license),
          ]

          failed = [name for name, ok in checks if not ok]
          if failed:
            raise SystemExit("Metadata consistency failed: " + ", ".join(failed))

          print(f"Metadata consistency checks passed (v{header_version}).")
          PY
